<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pxBg" cx="50%" cy="35%" r="95%">
      <stop offset="0%" stop-color="#131b3a"/>
      <stop offset="45%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>

    <linearGradient id="pxNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#7B2EFF"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>

    <linearGradient id="pxChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a3a52"/>
      <stop offset="50%" stop-color="#1c2540"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>

    <linearGradient id="pxPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0c1226" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="pxAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="pxGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pxGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pxShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <pattern id="pxHex" width="56" height="98" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M28 0 L56 16 L56 49 L28 65 L0 49 L0 16 Z" fill="none" stroke="#22315e" stroke-width="0.6" opacity="0.35"/>
      <path d="M28 65 L56 81 L56 114 L28 130 L0 114 L0 81 Z" fill="none" stroke="#22315e" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="1500" height="500" fill="url(#pxBg)"/>
  <rect width="1500" height="500" fill="url(#pxHex)"/>

  <!-- ===== Cyber grid floor (perspective) ===== -->
  <g stroke="#00D4FF" stroke-width="1" opacity="0.18">
    <line x1="0" y1="500" x2="520" y2="410"/>
    <line x1="230" y1="500" x2="600" y2="410"/>
    <line x1="460" y1="500" x2="680" y2="410"/>
    <line x1="1500" y1="500" x2="980" y2="410"/>
    <line x1="1270" y1="500" x2="900" y2="410"/>
    <line x1="1040" y1="500" x2="820" y2="410"/>
    <line x1="0" y1="460" x2="1500" y2="460" opacity="0.5"/>
    <line x1="150" y1="500" x2="1350" y2="500" opacity="0.7"/>
  </g>

  <!-- ===== Scanning laser sweep ===== -->
  <rect x="0" y="0" width="1500" height="3" fill="url(#pxAccent)" opacity="0.6">
    <animate attributeName="y" values="0;500;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Neural network web (right/back field) ===== -->
  <g stroke="#00D4FF" stroke-width="1" opacity="0.4">
    <line x1="1000" y1="80" x2="1120" y2="140"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="1120" y1="140" x2="1230" y2="90"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="1120" y1="140" x2="1180" y2="230"><animate attributeName="opacity" values="0.2;0.55;0.2" dur="2.1s" repeatCount="indefinite"/></line>
    <line x1="1230" y1="90" x2="1340" y2="150"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="1180" y1="230" x2="1300" y2="270"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="1300" y1="270" x2="1340" y2="150"><animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="1000" y1="80" x2="1180" y2="230"><animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.4s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#00F5FF">
    <circle cx="1000" cy="80" r="4" filter="url(#pxGlowSoft)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="140" r="5" filter="url(#pxGlowSoft)"><animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="90" r="4" filter="url(#pxGlowSoft)"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1340" cy="150" r="4" filter="url(#pxGlowSoft)"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="230" r="5" filter="url(#pxGlowSoft)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="270" r="4" filter="url(#pxGlowSoft)"><animate attributeName="opacity" values="1;0.5;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== Holographic AI brain (wireframe, upper right, slow rotation) ===== -->
  <g transform="translate(1250,90)" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate" values="0;6;0;-6;0" dur="9s" repeatCount="indefinite" additive="sum"/>
    <path d="M-60,-10 C-70,-40 -30,-60 0,-52 C20,-62 55,-45 50,-15 C68,-5 65,25 45,32 C50,55 20,68 0,55 C-20,68 -55,52 -48,28 C-70,20 -75,-5 -60,-10 Z"
      fill="none" stroke="#A855F7" stroke-width="1.4" filter="url(#pxGlowSoft)"/>
    <path d="M-40,-20 Q0,-35 40,-20 M-45,5 Q0,-8 45,5 M-40,28 Q0,15 40,28" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.7"/>
    <circle cx="-40" cy="-20" r="2.4" fill="#00F5FF"/>
    <circle cx="40" cy="-20" r="2.4" fill="#FF00E5"/>
    <circle cx="0" cy="-35" r="2.4" fill="#00F5FF"/>
    <circle cx="-45" cy="5" r="2.4" fill="#A855F7"/>
    <circle cx="45" cy="5" r="2.4" fill="#00F5FF"/>
    <circle cx="0" cy="55" r="2.4" fill="#FF00E5"/>
  </g>

  <!-- ===== Floating glass UI panels ===== -->
  <!-- Panel: GitHub Stats -->
  <g transform="translate(60,60)" filter="url(#pxShadow)">
    <animateTransform attributeName="transform" type="translate" values="60,60; 60,45; 60,60" dur="5s" repeatCount="indefinite" additive="sum"/>
    <rect width="200" height="110" rx="14" fill="url(#pxPanel)" stroke="url(#pxAccent)" stroke-width="1.2"/>
    <text x="14" y="24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#00F5FF" opacity="0.9">GITHUB STATS</text>
    <rect x="14" y="36" width="26" height="55" fill="#00D4FF" opacity="0.6"><animate attributeName="height" values="30;55;30" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="48" y="46" width="26" height="45" fill="#7B2EFF" opacity="0.6"><animate attributeName="height" values="45;20;45" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="82" y="30" width="26" height="61" fill="#FF00E5" opacity="0.6"><animate attributeName="height" values="61;35;61" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="116" y="55" width="26" height="36" fill="#00FFA3" opacity="0.6"><animate attributeName="height" values="36;60;36" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="150" y="40" width="26" height="51" fill="#00D4FF" opacity="0.5"><animate attributeName="height" values="51;25;51" dur="3.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Panel: Terminal -->
  <g transform="translate(60,200)" filter="url(#pxShadow)">
    <animateTransform attributeName="transform" type="translate" values="60,200; 60,215; 60,200" dur="5.6s" repeatCount="indefinite" additive="sum"/>
    <rect width="210" height="95" rx="14" fill="url(#pxPanel)" stroke="url(#pxAccent)" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="3.5" fill="#FF5F57"/>
    <circle cx="28" cy="16" r="3.5" fill="#FEBC2E"/>
    <circle cx="40" cy="16" r="3.5" fill="#28C840"/>
    <text x="14" y="38" font-family="Consolas, monospace" font-size="11" fill="#00FFA3">$ python train.py</text>
    <text x="14" y="54" font-family="Consolas, monospace" font-size="11" fill="#00D4FF">Epoch 12/50 ✓</text>
    <text x="14" y="70" font-family="Consolas, monospace" font-size="11" fill="#A855F7">loss: 0.0421</text>
    <rect x="14" y="78" width="8" height="12" fill="#00FFA3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Panel: Neural Net mini -->
  <g transform="translate(1230,320)" filter="url(#pxShadow)">
    <animateTransform attributeName="transform" type="translate" values="1230,320; 1230,335; 1230,320" dur="4.8s" repeatCount="indefinite" additive="sum"/>
    <rect width="210" height="105" rx="14" fill="url(#pxPanel)" stroke="url(#pxAccent)" stroke-width="1.2"/>
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#00F5FF">NEURAL NET</text>
    <g stroke="#7B2EFF" stroke-width="1" opacity="0.7">
      <line x1="30" y1="40" x2="90" y2="30"/><line x1="30" y1="60" x2="90" y2="55"/><line x1="30" y1="80" x2="90" y2="80"/>
      <line x1="90" y1="30" x2="150" y2="45"/><line x1="90" y1="55" x2="150" y2="45"/><line x1="90" y1="80" x2="150" y2="65"/>
      <line x1="150" y1="45" x2="185" y2="55"/><line x1="150" y1="65" x2="185" y2="55"/>
    </g>
    <g fill="#00F5FF">
      <circle cx="30" cy="40" r="3"/><circle cx="30" cy="60" r="3"/><circle cx="30" cy="80" r="3"/>
      <circle cx="90" cy="30" r="3"/><circle cx="90" cy="55" r="3"/><circle cx="90" cy="80" r="3"/>
      <circle cx="150" cy="45" r="3"/><circle cx="150" cy="65" r="3"/>
      <circle cx="185" cy="55" r="4" fill="#FF00E5"/>
    </g>
  </g>

  <!-- Panel: CPU / Memory -->
  <g transform="translate(1230,60)" filter="url(#pxShadow)">
    <animateTransform attributeName="transform" type="translate" values="1230,60; 1230,75; 1230,60" dur="5.2s" repeatCount="indefinite" additive="sum"/>
    <rect width="210" height="85" rx="14" fill="url(#pxPanel)" stroke="url(#pxAccent)" stroke-width="1.2"/>
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#00F5FF">CPU / MEMORY</text>
    <path d="M14,60 L34,45 L54,55 L74,35 L94,48 L114,30 L134,42 L154,25 L174,38 L194,32"
      fill="none" stroke="#00FFA3" stroke-width="1.8"/>
    <circle cx="194" cy="32" r="3" fill="#00FFA3"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== Floating particles ===== -->
  <g>
    <circle cx="90" cy="420" r="2.2" fill="#00F5FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1440" cy="420" r="2" fill="#FF00E5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.8" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="380" r="2" fill="#00FFA3"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="410" r="1.6" fill="#00D4FF"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== Energy ring behind name ===== -->
  <g transform="translate(750,250)">
    <ellipse rx="360" ry="110" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.22">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="360" ry="110" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.18" transform="rotate(70)">
      <animateTransform attributeName="transform" type="rotate" from="70" to="430" dur="26s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ===== Main Name: chrome 3D extruded + neon glass text ===== -->
  <g text-anchor="middle">
    <!-- extrusion depth layers -->
    <text x="754" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#pxChrome)" opacity="0.9" letter-spacing="3">SUBHASISH SAHOO</text>
    <text x="752" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#pxChrome)" opacity="0.9" letter-spacing="3">SUBHASISH SAHOO</text>
    <text x="750" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#pxChrome)" opacity="0.95" letter-spacing="3">SUBHASISH SAHOO</text>
    <!-- glowing glass top layer -->
    <text x="750" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800"
          fill="url(#pxNameGrad)" filter="url(#pxGlow)" letter-spacing="3">SUBHASISH SAHOO</text>
    <!-- soft highlight sheen -->
    <text x="750" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800"
          fill="#ffffff" opacity="0.12" letter-spacing="3">SUBHASISH SAHOO</text>
  </g>

  <!-- ===== Subtitle ===== -->
  <text x="750" y="300" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="21" fill="#b9d4ff" opacity="0.9">
    AI Engineer • Full Stack Developer • Machine Learning Enthusiast
  </text>

  <!-- Divider -->
  <rect x="650" y="318" width="200" height="3" rx="1.5" fill="url(#pxAccent)"/>
</svg>
